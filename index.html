<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이러브커피 네이버 카페에서 검색하기</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* Paperlogy 4 Regular */
  @font-face {
    font-family: 'Paperlogy';
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy@main/Paperlogy-4Regular.woff2') format('woff2');
  }

  /* ── 디자인 토큰 (450×60) ───────────────── */
  :root {
    --bar-h:        60px;   /* 바 전체 높이 */
    --bar-radius:   10px;
    --bar-pad-x:     8px;   /* 좌우 안쪽 여백 */
    --gap:          16px;   /* 입력영역 ↔ 버튼 */
    --text-inset:   10px;   /* 입력영역 내부 왼쪽 여백 (총 18px) */

    --btn-size:     48px;   /* 터치 영역 */
    --btn-radius:    8px;
    --icon-size:    48px;   /* 3D 아이콘은 자체 여백이 있어 크게 */

    --font-size:    15px;

    --c-bar-bg:     #FFFFFF;
    --c-text:       #2F3437;
    --c-placeholder:#7D8A97;
    --c-shadow:     rgba(13, 10, 44, 0.06);
    --c-ring:       rgba(141, 110, 99, 0.35);
    --c-focus:      #8D6E63;
  }

  /* ── 다크모드 ────────────────────────────────────────────────────
     브라우저/OS 설정을 따라갑니다. 노션 테마는 감지하지 못합니다.
     항상 어둡게 고정하고 싶으면, 아래 블록의 값들을 :root 안으로
     그대로 옮겨 붙이고 이 @media 블록은 지우세요.               */
  @media (prefers-color-scheme: dark) {
    :root {
      --c-bar-bg:     #2F3437;
      --c-text:       #E6E6E5;
      --c-placeholder:#A3AEB9;
      --c-shadow:     rgba(0, 0, 0, 0.35);
      --c-ring:       rgba(212, 179, 165, 0.45);
      --c-focus:      #D4B3A5;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;   /* 노션 페이지 배경이 비쳐 보이도록 */
  }

  body {
    /* 그림자가 잘리지 않을 만큼의 여백 */
    padding: 8px 4px;
    font-family: 'Paperlogy', 'Pretendard', -apple-system, BlinkMacSystemFont,
                 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  }

  /* ── 검색바 ─────────────────────────────────────────────────── */
  .searchbar {
    display: flex;
    align-items: center;
    gap: var(--gap);
    width: 100%;
    height: var(--bar-h);
    padding: 0 var(--bar-pad-x);
    background: var(--c-bar-bg);
    border-radius: var(--bar-radius);
    box-shadow: 0 4px 12px 0 var(--c-shadow);
    overflow: hidden;
    transition: box-shadow .18s ease;
  }

  /* 입력영역은 늘어나고 */
  .searchbar__field {
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    padding: 0 0 0 var(--text-inset);
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--c-text);
    font-family: inherit;
    font-size: var(--font-size);
    font-weight: 400;
    line-height: normal;
  }
  .searchbar__field::placeholder {
    color: var(--c-placeholder);
    opacity: 1;
  }
  /* 포커스 시 그림자와 테두리 강조 */
  .searchbar:focus-within {
    box-shadow: 0 4px 12px 0 var(--c-shadow), 0 0 0 2px var(--c-ring);
  }

  /* 버튼은 48×48 고정 */
  .searchbar__button {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--btn-size);
    height: var(--btn-size);
    padding: 0;
    border: 0;
    border-radius: var(--btn-radius);
    background: none;   /* 3D 아이콘 자체가 버튼 역할 */
    cursor: pointer;
    transition: transform .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .searchbar__button:hover  { transform: scale(1.08); }
  .searchbar__button:active { transform: scale(.94); }
  .searchbar__button:focus-visible {
    outline: 2px solid var(--c-focus);
    outline-offset: 2px;
  }

  .searchbar__button img {
    width: var(--icon-size);
    height: var(--icon-size);
    display: block;
  }

  @media (prefers-reduced-motion: reduce) {
    .searchbar, .searchbar__button { transition: none; }
  }
</style>
</head>
<body>
